<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Merchandising</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <meta name="theme-color" content="#0b1424">
  <script>
    // aplica o tema (claro/escuro) antes de desenhar a tela, para não piscar
    (function () { var t = null; try { t = localStorage.getItem('pm.tema'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
      document.documentElement.setAttribute('data-tema', t); })();
  </script>
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div id="app">
    <div class="boot">Carregando…</div>
  </div>
  <div id="modais"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
